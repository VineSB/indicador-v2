name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícone do app
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-* $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          cp -r android-res/* $RES/
          ls -R $RES | grep -c ic_launcher

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: indicador-midia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar o APK na branch apk
        run: |
          mkdir -p /tmp/apkout && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/indicador-midia.apk
          cd /tmp/apkout
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add indicador-midia.apk
          git commit -q -m "APK gerado"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
