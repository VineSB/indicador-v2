/* Layout: fundo topográfico fixo atrás de tudo; cabeçalho com busca geral; abas em pílulas fixas no topo (Início, Indicados, Pedir, Fila, Já assisti, Semana, Aguardando, Perfil, Histórico); capas em grade ou carrossel; detalhe do título como folha que sobe de baixo. */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --surface2: #e3e6ef;
  --card: color-mix(in srgb, var(--surface) 90%, transparent);
  --fg: #12141c;
  --muted: #565d71;
  --line: #d3d7e3;
  --accent: #3552f5;
  --accent-ink: #ffffff;
  --good: #14804a;
  --warn: #b25e09;
  --c-anime: #3552f5; --c-serie: #c2410c; --c-filme: #0f8a6a;
  --topo-ink: #4d5fa8; --topo-op: .2; --glow: color-mix(in srgb, var(--accent) 13%, transparent);
  --shadow: 0 1px 2px rgba(18,20,40,.06), 0 8px 24px rgba(18,20,40,.07);
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f16; --surface: #171a24; --surface2: #222632; --fg: #eceef5; --muted: #9ba1b5;
    --line: #2b3040; --accent: #8ea0ff; --accent-ink: #0e1017; --good: #55d08a; --warn: #f0a24d;
    --c-anime: #8ea0ff; --c-serie: #f0894d; --c-filme: #4fd0a8;
    --topo-ink: #8ea0ff; --topo-op: .14; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f16; --surface: #171a24; --surface2: #222632; --fg: #eceef5; --muted: #9ba1b5;
  --line: #2b3040; --accent: #8ea0ff; --accent-ink: #0e1017; --good: #55d08a; --warn: #f0a24d;
  --c-anime: #8ea0ff; --c-serie: #f0894d; --c-filme: #4fd0a8;
  --topo-ink: #8ea0ff; --topo-op: .14; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: auto; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg i { position: absolute; inset: 0; display: block; }
.glow { background: radial-gradient(800px 420px at 8% -8%, var(--glow), transparent 70%), radial-gradient(700px 480px at 100% 105%, color-mix(in srgb, var(--c-filme) 9%, transparent), transparent 70%); }

  -webkit-mask: var(--m) 0 0 / 900px 900px repeat;

}
.wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* header */
header { padding-top: 24px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(30px, 7vw, 44px); line-height: .95; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
h1 span { color: var(--accent); }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); text-align: right; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live[data-state="on"] .dot { background: var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#gq { font: inherit; font-size: 16px; width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 10px 44px 10px 42px; border-radius: 14px; box-shadow: var(--shadow); -webkit-appearance: none; appearance: none; }
#gq::-webkit-search-cancel-button { display: none; }
#gq:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.gclear { position: absolute; right: 6px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--fg); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; }

/* tabs */
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; margin: 14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: none; scroll-snap-align: center; color: var(--muted); text-decoration: none; padding: 9px 15px; font-weight: 600; font-size: 14px; white-space: nowrap; border-radius: 999px; border: 1px solid transparent; transition: background .2s ease, color .2s ease; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { background: var(--fg); color: var(--bg); }
main { padding-top: 22px; display: grid; gap: 36px; }
section[hidden] { display: none; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.sub { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.block { display: grid; gap: 14px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sechead a { font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hello h2 { font-size: clamp(34px, 8vw, 52px); margin-top: 4px; }
.stack { display: grid; gap: 30px; }
#s-inicio { display: grid; gap: 30px; }

/* posters */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.card { display: grid; gap: 8px; align-content: start; min-width: 0; }
.poster { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; background: #222; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 8px 22px rgba(10,12,24,.3); isolation: isolate; }
.poster svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,9,16,.88) 0%, rgba(8,9,16,.45) 38%, rgba(8,9,16,0) 62%); z-index: 1; }
.ptype { position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: rgba(8,9,16,.55); padding: 3px 7px; border-radius: 4px; }
.pbadge { position: absolute; top: 8px; right: 8px; z-index: 2; font-family: var(--font-display); font-weight: 900; font-size: 15px; color: #111; background: #ffd23f; padding: 1px 7px; border-radius: 4px; letter-spacing: .04em; }
.ptitle { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; color: #fff; font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 24px; line-height: .95; letter-spacing: .01em; overflow-wrap: anywhere; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.ptitle.long { font-size: 19px; }
.ptitle.xlong { font-size: 16px; }
.poster.sm .ptitle { font-size: 14px; left: 7px; right: 7px; bottom: 7px; }
.poster.sm .ptitle.long, .poster.sm .ptitle.xlong { font-size: 11.5px; }
.poster.sm .ptype { display: none; }
.ctitle.sm { font-size: 13px; }
.ctitle { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); }
.why { font-size: 14px; margin: 0; }
.dub { font-size: 12px; color: var(--good); font-weight: 600; }
.where { font-size: 13px; font-weight: 600; }
.qa { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qa .chip-btn { padding: 6px 12px; font-size: 12px; }
.qa .chip-btn.on { background: color-mix(in srgb, var(--good) 20%, var(--surface)); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }

/* carrossel */
.hscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 16px 12px; margin: 0 -16px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 132px; scroll-snap-align: start; display: grid; gap: 6px; align-content: start; }
.mini .t { font-size: 13px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }

/* upcoming + waiting rows */
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.row .poster { width: 54px; box-shadow: none; border-radius: 6px; }
.row .poster .ptitle, .row .poster .ptype, .row .poster .pbadge { display: none; }
.row h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.row p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface2); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.date { background: var(--accent); color: var(--accent-ink); }
.pill.soon { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); color: var(--warn); }
.pill.done { background: transparent; color: var(--muted); font-weight: 600; }
@media (max-width: 460px) { .row { grid-template-columns: 54px minmax(0, 1fr); } .row .pill, .row .movebtns { grid-column: 2; justify-self: start; } }

/* hoje */
.today { display: grid; gap: 8px; }
.it { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.it.anime { border-left-color: var(--c-anime); } .it.serie { border-left-color: var(--c-serie); }
.it time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.it b { display: block; font-size: 15px; overflow-wrap: anywhere; }
.it small { color: var(--muted); font-size: 12px; }
.it.past { opacity: .6; }
.calm { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; color: var(--fg); text-decoration: none; box-shadow: var(--shadow); min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 30px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
a.stat:hover { border-color: var(--accent); }
.cta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--surface)), var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 16px; padding: 16px; }
.cta b { font-family: var(--font-display); text-transform: uppercase; font-size: 22px; letter-spacing: .03em; display: block; line-height: 1.05; }
.cta span { font-size: 13px; color: var(--muted); }
@media (max-width: 460px) { .cta { grid-template-columns: 1fr; } }

/* watched */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip-btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: background .15s ease, transform .1s ease; }
.chip-btn:active { transform: scale(.96); }
.chip-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* aviso com desfazer */
.toast { position: fixed; z-index: 30; left: 50%; bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)); transform: translateX(-50%); width: min(480px, calc(100% - 32px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--fg); color: var(--bg); padding: 12px 14px 12px 16px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 14px; font-weight: 500; }

/* esqueleto de carregamento */

.skgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }

/* movimento */
@media (prefers-reduced-motion: no-preference) {
  .card, .mini { transition: transform .18s ease; }
  .card:hover, .mini:hover { transform: translateY(-3px); }
  .card:active, .mini:active, .row.open:active { transform: scale(.98); }
  section:not([hidden]) { animation: fadeup .28s ease both; }
  .modal:not([hidden]) { animation: fade .2s ease both; }
  .modal:not([hidden]) .sheet { animation: sheetup .3s cubic-bezier(.2,.8,.2,1) both; }
  .toast:not([hidden]) { animation: toastin .25s ease both; }
  .sk { background: linear-gradient(90deg, var(--surface2) 25%, color-mix(in srgb, var(--surface2) 55%, var(--surface)) 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes sheetup { from { transform: translateY(40px); opacity: .4; } }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 12px); } }
  @keyframes shimmer { to { background-position: -200% 0; } }
}

<body>
<div class="bg" aria-hidden="true"><i class="glow"></i><i class="topo"></i></div>
<div class="wrap">

    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gq" type="search" placeholder="Buscar anime, série ou filme" autocomplete="off" enterkeyhint="search" aria-label="Buscar qualquer título">

</div>

<script>
'use strict';
/* ====== utilidades ====== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const enc = encodeURIComponent;
function strip(html) {
  if (!html) return '';
  const t = document.createElement('div');
  t.innerHTML = String(html).replace(/<br\s*\/?>/gi, '\n');
  return (t.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}
let toastT = null;
function toast(msg, ms = 2600, undo) {
  const t = $('#toast'), b = $('#toastUndo');
  $('#toastTxt').textContent = msg;
  b.hidden = !undo;
  b.onclick = () => { if (undo) undo(); t.hidden = true; };
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, undo ? 5000 : ms);
}
const TYPES = {
  anime: { label: 'Anime', plural: 'Animes' },
  serie: { label: 'Série', plural: 'Séries' },
  filme: { label: 'Filme', plural: 'Filmes' }
};
const RATINGS = [0, 1, 2, 3, 4, 5, '5+'];
const rv = r => (r === '5+' ? 6 : Number(r));

/* ====== estado (salvo só neste aparelho) ====== */
const KEY = 'indicador_v2';
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && j.items) return Object.assign({ settings: {}, history: [], picks: [] }, j);
  } catch (e) {}
  return { v: 2, items: {}, settings: {}, history: [], picks: [] };
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Não consegui salvar os dados neste aparelho'); }
}
const ui = { tab: 'inicio', filter: 'todos', q: '', exp: {}, pickType: 'all', mood: '', loading: false, gq: '', gres: null, gseq: 0, stage: '' };
const keyOf = it => it.type + ':' + it.srcId;
const get = it => S.items[keyOf(it)] || null;

/* ====== rede ====== */
async function jget(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function gql(query, variables) {
  const r = await fetch('https://graphql.anilist.co', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ query, variables })
  });
  if (!r.ok) throw new Error('AniList ' + r.status);
  const j = await r.json();
  if (j.errors) throw new Error(j.errors[0].message);
  return j.data;
}

/* --- animes: AniList (grátis, sem chave) --- */
const ANI = 'id title{romaji english} seasonYear coverImage{large} description(asHtml:false) genres status trailer{id site} nextAiringEpisode{airingAt episode}';
function normAni(m) {
  return {
    type: 'anime', src: 'ani', srcId: String(m.id),
    title: (m.title && (m.title.english || m.title.romaji)) || '?',
    year: m.seasonYear || null,
    cover: m.coverImage && m.coverImage.large,
    synopsis: strip(m.description), genres: m.genres || [],
    trailer: m.trailer && m.trailer.site === 'youtube' ? 'https://www.youtube.com/watch?v=' + m.trailer.id : null,
    next: m.nextAiringEpisode ? { at: m.nextAiringEpisode.airingAt * 1000, ep: 'Ep. ' + m.nextAiringEpisode.episode } : null,
    apiStatus: m.status || null
  };
}
async function searchAnime(q) {
  const d = await gql(`query($q:String){Page(perPage:12){media(search:$q,type:ANIME,sort:SEARCH_MATCH){${ANI}}}}`, { q });
  return d.Page.media.map(normAni);
}
async function refreshAnime(it) {

/* --- Gemini (chave grátis do próprio usuário) --- */
function hasGemini() { return !!(S.settings.geminiKey || '').trim(); }
async function pickModel() {
  const manual = (S.settings.model || '').trim();
  if (manual) return manual;
  if (S.settings.autoModel) return S.settings.autoModel;
  let model = 'gemini-2.5-flash';
  try {
    const j = await jget('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': S.settings.geminiKey.trim() } });
    const ok = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /^models\/gemini-[\d.]+-flash$/.test(m.name));
    ok.sort((a, b) => parseFloat(b.name.match(/gemini-([\d.]+)-flash/)[1]) - parseFloat(a.name.match(/gemini-([\d.]+)-flash/)[1]));
    if (ok.length) model = ok[0].name.replace('models/', '');
  } catch (e) {}
  S.settings.autoModel = model;
  save();
  return model;
}
async function geminiRaw(prompt, json) {
  if (!hasGemini()) throw new Error('NO_KEY');
  const model = await pickModel();
  const body = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.8, maxOutputTokens: 1800 } };
  if (json) body.generationConfig.responseMimeType = 'application/json';
  const call = b => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.settings.geminiKey.trim() },
    body: JSON.stringify(b)
  });
  body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  let r = await call(body);
  if (r.status === 400) {
    delete body.generationConfig.thinkingConfig;
    const r2 = await call(body);
    if (r2.ok) r = r2;
  }
  if (!r.ok) {
    let msg = 'Gemini ' + r.status;
    try { const e = await r.json(); if (e.error && e.error.message) msg += ': ' + e.error.message.slice(0, 140); } catch (e) {}
    if (r.status === 404) { S.settings.autoModel = ''; save(); }
    const err = new Error(msg); err.status = r.status; throw err;
  }
  const j = await r.json();
  const parts = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts;
  const text = (parts || []).map(p => p.text || '').join('');
  if (!text) throw new Error('O Gemini não respondeu nada. Tente de novo.');
  return text;
}
function parseJson(t) {
  const s = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(s); } catch (e) {}
  const m = s.match(/\[[\s\S]*\]/);
  if (m) return JSON.parse(m[0]);
  throw new Error('Resposta do Gemini em formato inesperado.');
}
function friendlyErr(e) {
  if (e.message === 'NO_KEY') return 'Configure a chave do Gemini nos Ajustes.';
  if (e.status === 429) return 'Limite gratuito do Gemini atingido por agora. Tente de novo em alguns minutos.';
  if (e.status === 400 || e.status === 403) return 'O Gemini recusou a chave. Confira se ela foi colada inteira nos Ajustes.';
  return e.message || 'Algo deu errado.';
}
async function resolveTitle(s) {
  const type = TYPES[s.type] ? s.type : null;
  if (!type || !s.title) return null;
  const res = await SEARCHERS[type](String(s.title)).catch(() => []);
  if (!res.length) return null;
  const y = Number(s.year);
  const best = (y && res.find(r => r.year && Math.abs(r.year - y) <= 1)) || res[0];
  return best;
}
const norm = t => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '');
async function geminiTitles(prompt, wantType) {
  const raw = await geminiRaw(prompt, true);
  ui.stage = 'Buscando as capas...'; if (ui.loading && ui.tab === 'pedir') render();
  const list = parseJson(raw);
  if (!Array.isArray(list)) throw new Error('Resposta do Gemini em formato inesperado.');
  const out = [];
  const seen = new Set();
  const found = await Promise.all(list.slice(0, 20).map(async s => {
    const r = await resolveTitle({ type: wantType || s.type, title: s.title, year: s.year });
    return r ? { r, why: s.why || '' } : null;
  }));
  for (const f of found) {
    if (!f) continue;
    const k = keyOf(f.r);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(Object.assign({}, f.r, { why: f.why }));
  }
  return out;
}
async function similar(it) {
  try {
    if (it.src === 'ani') return await similarAnime(it);
    if (it.src === 'tmdb') return await similarFilme(it);
  } catch (e) {}
  if (!hasGemini()) throw new Error('Para ver parecidos de séries e filmes sem chave TMDB, configure o Gemini nos Ajustes.');
  const prompt = `Liste 8 ${TYPES[it.type].plural.toLowerCase()} parecidos com "${it.title}"${it.year ? ' (' + it.year + ')' : ''}. Só títulos reais, usando o nome internacional mais conhecido. Responda APENAS um JSON: [{"type":"${it.type}","title":"...","year":2020}]`;
  const r = await geminiTitles(prompt, it.type);
  return r.filter(x => keyOf(x) !== keyOf(it));
}

function whenStr(ts) {
  const d = new Date(ts), n = new Date();
  if (ts < Date.now()) return 'já lançou';
  const day = x => Date.UTC(x.getFullYear(), x.getMonth(), x.getDate());
  const dd = Math.round((day(d) - day(n)) / 864e5);
  const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (dd === 0) return 'hoje às ' + hm;
  if (dd === 1) return 'amanhã às ' + hm;
  return d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }) + ' às ' + hm;
}
function countdown(ts) {
  const m = Math.max(0, Math.floor((ts - Date.now()) / 6e4));
  const d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60), mm = m % 60;
  return d ? `${d}d ${hh}h` : hh ? `${hh}h ${mm}min` : `${mm}min`;
}

/* ====== indicações (Gemini) ====== */
async function askPicks() {
  if (ui.loading) return;
  ui.loading = true; ui.stage = 'Consultando o Gemini...'; render();
  let ok = false;
  try {
    const items = Object.values(S.items);
    const rated = items.filter(i => i.rating != null);
    const list = arr => arr.slice(0, 40).map(i => i.title).join('; ') || 'nenhum';
    const types = ui.pickType === 'all' ? ['anime', 'serie', 'filme'] : [ui.pickType];
    const n = ui.pickType === 'all' ? 3 : 6;
    const exclude = items.map(i => i.title).slice(0, 250).join('; ') || 'nenhum';
    const typeNames = types.map(t => TYPES[t].plural.toLowerCase()).join(', ');
    const profile = rated.length < 3
      ? 'O usuário ainda avaliou poucos títulos: sugira títulos populares e bem avaliados, variados.'
      : `Favoritos (nota 5 ou 5+): ${list(rated.filter(i => rv(i.rating) >= 5))}.\nGostou (nota 4): ${list(rated.filter(i => rv(i.rating) === 4))}.\nNão gostou (nota 0 a 2): ${list(rated.filter(i => rv(i.rating) <= 2))}.`;
    const prompt = `Você é um indicador de filmes, séries e animes.\n${profile}\nJá tem na lista (NÃO repetir): ${exclude}.\nPedido: ${n} de cada tipo entre: ${typeNames}.${ui.mood.trim() ? '\nPedido extra do usuário: ' + ui.mood.trim() : ''}\nRegras: só títulos reais, já lançados e disponíveis em streaming ou locação no Brasil; use o nome internacional mais conhecido; combine com o gosto acima.\nResponda APENAS um JSON: [{"type":"anime|serie|filme","title":"...","year":2020,"why":"uma frase curta em português dizendo por que combina"}]`;
    const raw = await geminiTitles(prompt, null);
    const have = new Set(items.map(keyOf));
    const picks = raw.filter(p => !have.has(keyOf(p)) && types.includes(p.type));
    if (!picks.length) throw new Error('Não consegui montar indicações dessa vez. Tente de novo.');
    S.picks = picks; S.picksAt = Date.now();
    S.history.unshift({ at: Date.now(), ask: ui.mood.trim(), titles: picks.map(p => p.title) });
    S.history = S.history.slice(0, 30);
    save(); ok = true;
  } catch (e) { toast(friendlyErr(e), 4500); }
  ui.loading = false;
  if (ok) { ui.tab = 'indicados'; window.scrollTo(0, 0); }
  render();
}

    h('label', null, 'TMDB (filmes com sinopse em português)'), tm,
    h('p', { class: 'fine' }, 'Grátis em themoviedb.org/settings/api (pode usar o token de leitura).'),
    h('div', { class: 'btns' },
      h('button', { class: 'btn', type: 'button', onclick: () => { S.settings.geminiKey = key.value.trim(); S.settings.tmdbKey = tm.value.trim(); S.settings.model = mdl.value.trim(); S.settings.autoModel = ''; save(); toast('Salvo'); render(); } }, 'Salvar'),
      h('button', { class: 'btn alt', type: 'button', onclick: async ev => {
        S.settings.geminiKey = key.value.trim(); S.settings.model = mdl.value.trim(); S.settings.autoModel = ''; save();
        const b = ev.currentTarget; b.disabled = true; b.replaceChildren(h('span', { class: 'spin' }));
        try { await geminiRaw('Responda apenas: ok', false); toast('Gemini funcionando!'); } catch (e) { toast(friendlyErr(e), 4500); }
        b.disabled = false; b.textContent = 'Testar Gemini';
      } }, 'Testar Gemini'))));
  const box = h('textarea', { placeholder: 'Cole aqui um backup para restaurar' });
  s.append(h('div', { class: 'addform' }, h('h3', null, 'Backup'),
    h('p', { class: 'fine' }, 'Copie o backup e guarde (por exemplo, mandando para você mesmo).'),
    h('div', { class: 'btns' }, h('button', { class: 'btn alt', type: 'button', onclick: async () => {
      const data = JSON.stringify({ v: 2, items: S.items, history: S.history });
      try { await navigator.clipboard.writeText(data); toast('Backup copiado'); } catch (e) { box.value = data; box.select(); toast('Copie o texto abaixo'); }
    } }, 'Copiar backup')),
    box,
    h('div', { class: 'btns' }, h('button', { class: 'btn alt', type: 'button', onclick: () => {
      try {
        const j = JSON.parse(box.value);
        if (!j.items || typeof j.items !== 'object') throw 0;
        if (!confirm('Restaurar vai substituir sua lista atual. Continuar?')) return;
        S.items = j.items; S.history = j.history || []; save(); toast('Restaurado'); render();
      } catch (e) { toast('Backup inválido'); }
    } }, 'Restaurar'))));
  s.append(h('div', { class: 'addform' }, h('h3', null, 'Apagar tudo'),
    h('p', { class: 'fine' }, 'Remove sua lista, notas e indicações deste aparelho. As chaves ficam.'),
    h('div', { class: 'btns' }, h('button', { class: 'btn alt', type: 'button', style: 'color:var(--warn)', onclick: () => {
      if (!confirm('Apagar toda a sua lista?')) return;
      S.items = {}; S.history = []; S.picks = []; save(); toast('Tudo apagado'); render();
    } }, 'Apagar minha lista'))));
  return s;
}

/* ====== tutorial de boas-vindas ====== */
function openTour() {
  const wrap = $('#tour');
  wrap.hidden = false;
  const N = 6;
  let step = 0, msg = null;
  const nm = () => (S.settings.name || '').trim();
  const finish = dest => {
    S.settings.tourDone = true; save();
    wrap.hidden = true; wrap.replaceChildren();
    ui.tab = 'inicio';
    render(); window.scrollTo(0, 0);
    if (dest === 'search') setTimeout(() => $('#gq').focus(), 120);
  };
  const setMsg = (t, cls) => { if (msg) { msg.textContent = t; msg.className = 'msg ' + (cls || ''); } };
  const draw = () => {
    msg = h('div', { class: 'msg' });
    let body, primary, secondary = null;
    if (step === 0) {
      const inp = h('input', { type: 'text', id: 'tourName', placeholder: 'Seu nome', value: S.settings.name || '', autocomplete: 'given-name', enterkeyhint: 'done' });
      const go1 = () => { const v = inp.value.trim(); if (!v) { setMsg('Digite seu nome para continuar.', 'err'); return; } S.settings.name = v; save(); step = 1; draw(); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go1(); });
      body = h('div', null, h('div', { class: 'big' }, '👋'), h('h2', null, 'Oi! Eu sou o seu Indicador'),
        h('p', { class: 'muted' }, 'Seu cantinho para animes, séries e filmes: o que você já viu, o que quer ver e o que está esperando voltar.'),
        h('label', { class: 'f' }, 'Como você se chama?'), inp, msg);
      primary = h('button', { class: 'btn', onclick: go1 }, 'Continuar');
      setTimeout(() => inp.focus(), 50);
    } else if (step === 1) {
      body = h('div', null, h('div', { class: 'big' }, '🎬'), h('h2', null, 'Prazer, ' + nm() + '!'),
        h('p', null, 'Em 1 minuto você deixa tudo pronto. Vou te mostrar como o app funciona e te ajudar a ligar a IA que faz as indicações.'),
        h('p', { class: 'muted' }, 'O app começa totalmente vazio: só aparece o que você mesmo adicionar. Nada sai do seu celular, a não ser as buscas.'));
      primary = h('button', { class: 'btn', onclick: () => { step = 2; draw(); } }, 'Mostrar como funciona');
    } else if (step === 2) {
      const row = (ic, t, d) => h('div', { class: 'tstep' }, h('div', { class: 'ic' }, ic), h('div', null, h('b', null, t), h('div', { class: 'small muted' }, d)));
      body = h('div', null, h('h2', null, 'Como o app funciona'),
        row('🔍', 'Busca', 'A barra lá em cima acha qualquer anime, série ou filme. Toque no título para ver sinopse, trailer e parecidos, e dar uma nota de 0 a 5. O 5+ é para o que você amou e reassistiria. Dar nota já marca como assistido.'),
        row('✨', 'Indicados e Pedir', 'Peça uma indicação e a IA sugere títulos com base nas suas notas. Quanto mais notas, melhor.'),
        row('📅', 'Início e Semana', 'Mostram o que sai hoje e o próximo episódio de cada título que você acompanha.'),
        row('📚', 'Fila, Já assisti e Aguardando', 'O que você quer ver, tudo que já viu por nota, e as temporadas que espera.'),
        row('📊', 'Perfil e Histórico', 'Seu gosto resumido e tudo que a IA já indicou. Os Ajustes ficam na última aba.'));
      primary = h('button', { class: 'btn', onclick: () => { step = 3; draw(); } }, 'Entendi');
      secondary = h('button', { class: 'btn sec', onclick: () => { step = 1; draw(); } }, 'Voltar');
    } else if (step === 3) {
      const row = (n, node) => h('div', { class: 'tstep' }, h('div', { class: 'n' }, n), h('div', null, node));
      body = h('div', null, h('h2', null, 'Ligando a IA (de graça)'),
        h('p', { class: 'muted' }, 'As indicações usam o Gemini, a IA do Google. Você só precisa de uma conta Google (a mesma do Gmail) para criar uma chave grátis. Leva 1 minuto.'),
        row('1', h('div', null, 'Toque no botão abaixo. Ele abre o Google AI Studio.')),
        row('2', h('div', null, 'Entre com a sua conta Google, se pedir, e aceite os termos.')),
        row('3', h('div', null, 'Procure o botão de criar chave de API (algo como ', h('b', null, '"Create API key"'), ' ou ', h('b', null, '"Criar chave de API"'), ') e crie uma.')),
        row('4', h('div', null, 'Toque em copiar na chave que aparecer (ela costuma começar com ', h('b', null, 'AIza'), ') e volte para este app.')),
        h('a', { class: 'btn', style: 'display:block;text-align:center;text-decoration:none;margin-top:14px;padding:13px', href: 'https://aistudio.google.com/apikey', target: '_blank', rel: 'noopener' }, 'Abrir o Google AI Studio'),
        h('p', { class: 'small muted' }, 'Os botões do Google podem mudar de nome com o tempo, mas o caminho é sempre esse. A chave fica salva só no seu celular.'));
      primary = h('button', { class: 'btn', onclick: () => { step = 4; draw(); } }, 'Já copiei a chave');
      secondary = h('button', { class: 'btn sec', onclick: () => { step = 2; draw(); } }, 'Voltar');
    } else if (step === 4) {
      const inp = h('input', { type: 'password', placeholder: 'Cole a chave aqui', value: S.settings.geminiKey || '', autocomplete: 'off' });
      const pasteBtn = h('button', { class: 'btn sec', style: 'margin-top:8px', onclick: async () => {
        try { inp.value = (await navigator.clipboard.readText()).trim(); setMsg(inp.value ? 'Colado. Agora toque em "Testar e salvar".' : 'A área de transferência está vazia.', inp.value ? 'ok' : 'err'); }
        catch (e) { setMsg('Não consegui ler sozinho. Segure o dedo no campo e escolha Colar.', 'err'); }
      } }, 'Colar da área de transferência');
      const test = h('button', { class: 'btn', onclick: async () => {
        const v = inp.value.trim();
        if (!v) { setMsg('Cole a chave primeiro.', 'err'); return; }
        S.settings.geminiKey = v; S.settings.autoModel = ''; save();
        test.disabled = true; test.replaceChildren(h('span', { class: 'spin' })); setMsg('');
        try { await geminiRaw('Responda apenas: ok', false); setMsg('Funcionou! Gemini ligado.', 'ok'); setTimeout(() => { step = 5; draw(); }, 700); }
        catch (e) { S.settings.geminiKey = ''; save(); setMsg(friendlyErr(e), 'err'); test.disabled = false; test.textContent = 'Testar e salvar'; }
      } }, 'Testar e salvar');
      body = h('div', null, h('h2', null, 'Cole a chave'), h('p', { class: 'muted' }, 'Cole aqui a chave que você copiou do Google AI Studio.'), inp, pasteBtn, msg);
      primary = test;
      secondary = h('button', { class: 'btn sec', onclick: () => { step = 3; draw(); } }, 'Voltar');
    } else {
      const hasKey = hasGemini();
      body = h('div', null, h('div', { class: 'big' }, hasKey ? '🎉' : '👍'), h('h2', null, 'Tudo pronto, ' + nm() + '!'),
        h('p', null, 'Para as indicações acertarem o seu gosto, comece pela busca lá em cima: ache 5 ou mais títulos que você ama e dê nota 5 ou 5+.'),
        hasKey ? h('p', { class: 'muted' }, 'Depois é só ir em Pedir e tocar em Indicar.')
               : h('p', { class: 'muted' }, 'Você pulou a chave do Gemini. Sem problema: o resto do app funciona. Para ligar as indicações depois, abra a aba Ajustes.'));
      primary = h('button', { class: 'btn', onclick: () => finish('search') }, 'Ir para Buscar');
      secondary = h('button', { class: 'btn sec', onclick: () => finish('home') }, 'Começar');
    }
    const skip = step >= 1 && step <= 4 ? h('button', { class: 'btn sec sm', onclick: () => { if (step === 3 || step === 4) { step = 5; draw(); } else finish('home'); } }, step >= 3 ? 'Fazer depois' : 'Pular') : h('span');
    wrap.replaceChildren(h('div', { class: 'inner' },
      h('div', { class: 'tourTop' }, h('div', { class: 'dots' }, Array.from({ length: N }, (_, i) => h('i', { class: i === step ? 'on' : '' }))), skip),
      h('div', { class: 'grow' }, body),
      h('div', { class: 'tourFoot' }, secondary, primary)));
    wrap.scrollTop = 0;
  };
  draw();
}


/* ====== navegação ====== */
const TABS = [['inicio', 'Início'], ['indicados', 'Indicados'], ['pedir', 'Pedir'], ['fila', 'Fila'], ['assisti', 'Já assisti'], ['semana', 'Semana'], ['aguardando', 'Aguardando'], ['perfil', 'Perfil'], ['historico', 'Histórico'], ['ajustes', 'Ajustes']];
function buildNav() {
  $('#tabs').replaceChildren(...TABS.map(([id, lb]) => h('a', { href: '#' + id, 'data-tab': id, onclick: e => { e.preventDefault(); go(id); } }, lb)));
}
function setActive() {
  document.querySelectorAll('#tabs a').forEach(a => { if (a.dataset.tab === ui.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function clearSearch() { ui.gq = ''; ui.gres = null; $('#gq').value = ''; $('#gClear').hidden = true; }
function go(t) {
  ui.tab = t; clearSearch(); render(); window.scrollTo(0, 0);
  const a = document.querySelector('#tabs a[data-tab="' + t + '"]');
  if (a && a.scrollIntoView) a.scrollIntoView({ inline: 'center', block: 'nearest' });
  if (['inicio', 'semana', 'aguardando'].includes(t)) refreshTracked(false);
}
function updateLive() {
  const on = hasGemini();
  $('#live').dataset.state = on ? 'on' : 'off';
  $('#liveTxt').textContent = on ? 'IA ligada' : 'IA desligada';
}
function applyTheme() {
  const t = S.settings.theme;
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
function render() {
  applyTheme(); setActive(); updateLive();
  const searching = ui.gq.trim().length >= 2;
  $('#sres').hidden = !searching; $('#main').hidden = searching;
  if (searching) { $('#sres').replaceChildren(viewSres()); return; }
  const views = { inicio: viewInicio, indicados: viewIndicados, pedir: viewPedir, fila: viewFila, assisti: viewAssisti, semana: viewSemana, aguardando: viewAguardando, perfil: viewPerfil, historico: viewHistorico, ajustes: viewAjustes };
  $('#main').replaceChildren(views[ui.tab]());
}
let gqT = null;
const gq = $('#gq');
gq.addEventListener('input', e => {
  ui.gq = e.target.value; $('#gClear').hidden = !ui.gq; clearTimeout(gqT);
  if (ui.gq.trim().length < 2) { ui.gres = null; render(); return; }
  gqT = setTimeout(runGlobal, 600);
});
gq.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(gqT); gq.blur(); runGlobal(); } });
$('#gClear').addEventListener('click', () => { clearSearch(); render(); });
$('#live').addEventListener('click', () => go('ajustes'));
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('open') && e.target.tagName !== 'INPUT') { e.preventDefault(); e.target.click(); } });
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
buildNav();
render();
if (!S.settings.tourDone) openTour();
refreshTracked(false);
setInterval(() => {
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (['inicio', 'semana', 'aguardando'].includes(ui.tab) && $('#modal').hidden && $('#tour').hidden && !typing && !ui.gq) render();
}, 60000);
</script>
